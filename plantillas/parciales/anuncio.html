<article class="tarjeta anuncio {% if a.fijado %}anuncio-fijado{% endif %}">
  <div class="meta">
    {% if a.fijado %}<span class="etiqueta">📌 Fijado</span>{% endif %}
    {% if a.club_slug %}<a class="club-enlace" href="/clubes/{{ a.club_slug }}/anuncios">c/{{ a.club_slug }}</a>{% else %}<span class="etiqueta etiqueta-general">Anuncio general</span>{% endif %}
    <span class="punto">•</span><span>{{ a.autor_nombre }}</span><span class="punto">•</span><time class="tenue">{{ a.creado_en | fecha }}</time>
  </div>
  <h2 class="titulo-pub">{{ a.titulo }}</h2>
  <div class="cuerpo">{{ a.contenido | saltos }}</div>
  {% if puede_eliminar_anuncios %}
  <form method="post" action="/anuncios/{{ a.id }}/eliminar" data-confirmar="¿Eliminar este anuncio?">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="siguiente" value="{{ ruta_completa }}">
    <button class="enlace enlace-peligro">🗑 Eliminar</button>
  </form>
  {% endif %}
</article>
