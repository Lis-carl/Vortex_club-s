{# Aviso breve: se ve en el inicio mientras el recordatorio no se ha leído y se oculta solo a los pocos
   segundos (animación CSS). El recordatorio queda guardado en Notificaciones. #}
<section class="recordatorio" role="status" aria-label="Recordatorio de asistencia">
  {% for r in recordatorios %}
  <a class="recordatorio-fila" href="{{ r.enlace }}">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>{{ r.texto }}</span>
  </a>
  {% endfor %}
  <a class="recordatorio-mas" href="/notificaciones">Ver en notificaciones</a>
</section>
