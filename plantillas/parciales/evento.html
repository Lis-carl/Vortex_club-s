<article class="tarjeta evento">
  <div class="fecha-tarjeta fecha-grande"><b>{{ e.fecha_inicio | dia }}</b><span>{{ e.fecha_inicio | mes }}</span></div>
  <div class="evento-texto">
    <h3>{{ e.titulo }}</h3>
    <p class="tenue">🕒 {{ e.fecha_inicio | hora }} · 📍 {{ e.lugar }}{% if e.cupo %} · 👥 cupo {{ e.cupo }}{% endif %}
      {% if mostrar_club %} · <a href="/clubes/{{ e.club_slug }}/eventos">{{ e.club_nombre }}</a>{% endif %}</p>
    <p>{{ e.descripcion | saltos }}</p>
  </div>
</article>
