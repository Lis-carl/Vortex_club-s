{% for pub in publicaciones %}
  {% set completa = False %}
  {% include "parciales/publicacion.html" %}
{% else %}
  <section class="tarjeta vacio">
    <p class="emoji-grande">💬</p>
    <p>{{ mensaje_vacio }}</p>
  </section>
{% endfor %}
{% if pagina > 1 or hay_mas %}
<nav class="paginacion" aria-label="Paginación">
  {% if pagina > 1 %}<a class="boton boton-claro" href="?{{ base_consulta }}pagina={{ pagina - 1 }}">← Anteriores</a>{% endif %}
  {% if hay_mas %}<a class="boton boton-claro" href="?{{ base_consulta }}pagina={{ pagina + 1 }}">Más antiguas →</a>{% endif %}
</nav>
{% endif %}
